name: Test Rust Module

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Run Rust module tests
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run standalone test
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          module: ./ci
          args: test-standalone
          version: "0.20.3"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Run extra-packages test
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          module: ./ci
          args: test-with-extra-packages
          version: "0.20.3"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Run extra-repositories test
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          module: ./ci
          args: test-with-extra-repositories
          version: "0.20.3"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
